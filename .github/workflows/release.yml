name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from build.sh
        id: version
        run: |
          VERSION=$(grep '^VERSION=' build.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} does not exist"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.check_release.outputs.exists == 'false'
        run: |
          chmod +x build.sh
          ./build.sh

      # ========== Apple Code Signing & Notarization ==========

      - name: Import Code Signing Certificate
        if: steps.check_release.outputs.exists == 'false'
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERT_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Code Sign App (Hardened Runtime)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application: Jiho Kim (T4BG6AUM72)" \
            --timestamp \
            .build/ai-notifier.app

          # Verify signature
          codesign --verify --verbose .build/ai-notifier.app

      - name: Create ZIP archive
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cd .build
          zip -r "../ai-notifier-${{ steps.version.outputs.version }}.zip" ai-notifier.app
          cd ..
          ls -la *.zip

      - name: Create DMG
        if: steps.check_release.outputs.exists == 'false'
        run: |
          # Create staging directory
          mkdir -p dmg-staging
          cp -r .build/ai-notifier.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          # Create DMG
          hdiutil create -volname "AINotifier" -srcfolder dmg-staging -ov -format UDZO "AI-Notifier.dmg"

          # Cleanup staging
          rm -rf dmg-staging
          ls -la *.dmg

      - name: Sign DMG
        if: steps.check_release.outputs.exists == 'false'
        run: |
          codesign --force \
            --sign "Developer ID Application: Jiho Kim (T4BG6AUM72)" \
            --timestamp \
            "AI-Notifier.dmg"

          # Verify
          codesign --verify --verbose "AI-Notifier.dmg"

      - name: Notarize DMG
        if: steps.check_release.outputs.exists == 'false'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Submit for notarization
          xcrun notarytool submit "AI-Notifier.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "AI-Notifier.dmg"

          # Verify stapling
          xcrun stapler validate "AI-Notifier.dmg"

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      # ========== Release ==========

      - name: Generate release notes
        if: steps.check_release.outputs.exists == 'false'
        id: release_notes
        run: |
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Changes since $LAST_TAG:" >> release_notes.md
            git log --pretty=format:"- %s" "$LAST_TAG"..HEAD >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Option 1: DMG (Recommended)" >> release_notes.md
          echo "1. Download \`AI-Notifier.dmg\`" >> release_notes.md
          echo "2. Open the DMG and drag \`ai-notifier.app\` to Applications" >> release_notes.md
          echo "3. Double-click to run and complete setup" >> release_notes.md
          echo "" >> release_notes.md
          echo "> **Note**: This release is signed and notarized by Apple." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Option 2: ZIP" >> release_notes.md
          echo "1. Download \`ai-notifier-${{ steps.version.outputs.version }}.zip\`" >> release_notes.md
          echo "2. Unzip and move \`ai-notifier.app\` to \`/Applications\`" >> release_notes.md
          echo "3. Double-click to run and complete setup" >> release_notes.md

          cat release_notes.md

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md \
            "AI-Notifier.dmg" \
            "ai-notifier-${{ steps.version.outputs.version }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release v${{ steps.version.outputs.version }} already exists, skipping..."
